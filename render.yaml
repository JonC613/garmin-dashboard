services:
  # Frontend
  - type: web
    name: garmin-dashboard-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend
  - type: web
    name: garmin-dashboard-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: garmin-postgres
          property: connectionString
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
    healthCheckPath: /

  # Database
  - type: pserv
    name: garmin-postgres
    plan: starter
    ipAllowList: []
    databaseName: garmin_dashboard
    databaseUser: postgres

# Environment variables
envVarGroups:
  - name: garmin-dashboard-config
    envVars:
      - key: GARMIN_EMAIL
        value: your-email@example.com
      - key: GARMIN_PASSWORD
        value: your-password
